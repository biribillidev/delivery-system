spring.application.name=order-service
server.port=8080

# --- Eureka ---
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=10
# Refresh the load balancer's instance list quickly (default is 35s)
spring.cloud.loadbalancer.cache.ttl=5s

# --- RabbitMQ ---
# Eureka (8761) and RabbitMQ (5672) use the Spring default addresses
spring.rabbitmq.username=myuser
spring.rabbitmq.password=secret

# --- Database ---
# LOCK_TIMEOUT: concurrent orders wait for the row lock instead of failing after 2s
spring.datasource.url=jdbc:h2:mem:orderdb;LOCK_TIMEOUT=60000
spring.datasource.hikari.maximum-pool-size=60
spring.datasource.hikari.connection-timeout=60000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Spring AI (the key never goes to the repository) ---
# The key comes from an environment variable or from the git-ignored file local.properties
# (see local.properties.example). Defaults point to Groq (free tier, OpenAI-compatible API).
spring.config.import=optional:file:./local.properties,optional:file:./order-service/local.properties
spring.ai.openai.api-key=${OPENAI_API_KEY:not-configured}
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://api.groq.com/openai/v1}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:openai/gpt-oss-120b}

# --- Rate limit (bonus): POST /orders ---
rate-limit.orders.enabled=true
rate-limit.orders.requests-per-second=20

# Error messages always in English, regardless of the machine's locale
spring.web.locale=en
spring.web.locale-resolver=fixed
